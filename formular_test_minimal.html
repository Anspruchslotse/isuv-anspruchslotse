<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TBG Formular – Minimaltest</title>
  <script>
    window.onerror = function(msg, src, line) {
      document.getElementById('status').innerHTML = '<span style="color:red">❌ JS-Fehler: ' + msg + ' (Zeile ' + line + ')</span>';
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.23.2/babel.min.js"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f0f4f8; }
    .box { background: white; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .ok { color: #2e7d32; } .err { color: #c62828; }
  </style>
</head>
<body>
<div id="status" style="background:#fff3cd;padding:10px;border-radius:8px;margin-bottom:16px;font-size:13px;">
  ⏳ Lade React...
</div>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

const params = new URLSearchParams(window.location.search);
const FORM_ID = params.get('id') || '';
const SB_URL  = params.get('sb') || '';
const SB_KEY  = params.get('key') || '';

function TestApp() {
  const [info, setInfo] = useState('Prüfe Verbindung...');

  useEffect(() => {
    if (!FORM_ID) { setInfo('❌ Kein ?id= Parameter im Link'); return; }
    if (!SB_URL)  { setInfo('❌ Kein ?sb= Parameter im Link'); return; }
    if (!SB_KEY)  { setInfo('❌ Kein ?key= Parameter im Link'); return; }
    
    setInfo('🔄 Suche Formular in Supabase...\n\nID: ' + FORM_ID + '\nURL: ' + SB_URL);
    
    fetch(SB_URL + '/rest/v1/formulare?formular_id=eq.' + encodeURIComponent(FORM_ID), {
      headers: { 'Content-Type': 'application/json', 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY }
    })
    .then(r => {
      if (!r.ok) return r.text().then(t => { throw new Error('HTTP ' + r.status + ': ' + t.slice(0,200)); });
      return r.json();
    })
    .then(rows => {
      if (!rows || rows.length === 0) {
        setInfo('❌ Formular nicht gefunden in Supabase.\n\nID gesucht: ' + FORM_ID + '\n\nMögliche Ursachen:\n• INSERT beim Versenden hat nicht funktioniert\n• Falsche Tabelle / fehlende RLS-Policy');
      } else {
        var row = rows[0];
        setInfo('✅ Formular gefunden!\n\nTyp: ' + row.typ + '\nStatus: ' + row.status + '\nLabel: ' + row.label);
      }
    })
    .catch(e => setInfo('❌ Fehler: ' + e.message));
  }, []);

  return (
    <div className="box">
      <h3 style={{marginBottom:'12px', color:'#003366'}}>TBG Formular – Diagnose</h3>
      <pre style={{whiteSpace:'pre-wrap', fontSize:'13px', lineHeight:'1.6'}}>{info}</pre>
      <hr style={{margin:'16px 0', border:'none', borderTop:'1px solid #eee'}}/>
      <div style={{fontSize:'11px', color:'#888'}}>
        <strong>URL-Parameter:</strong><br/>
        id: {FORM_ID || '(leer)'}<br/>
        sb: {SB_URL || '(leer)'}<br/>
        key: {SB_KEY ? '***' + SB_KEY.slice(-6) + ' (' + SB_KEY.length + ' Zeichen)' : '(leer)'}
      </div>
    </div>
  );
}

document.getElementById('status').innerHTML = '<span class="ok">✅ React & Babel geladen</span>';

const container = document.getElementById('root');
if (ReactDOM.createRoot) {
  ReactDOM.createRoot(container).render(React.createElement(TestApp));
} else {
  ReactDOM.render(React.createElement(TestApp), container);
}
</script>
</body>
</html>
