<script>
window.addEventListener('load', function() {
  var out = document.getElementById('out');
  var lines = [];
  lines.push('React: ' + (typeof React!=='undefined'?'OK v'+React.version:'FEHLT'));
  lines.push('ReactDOM: ' + (typeof ReactDOM!=='undefined'?'OK':'FEHLT'));
  lines.push('Babel: ' + (typeof Babel!=='undefined'?'OK':'FEHLT'));
  var p = new URLSearchParams(location.search);
  lines.push('id: ' + (p.get('id')||'LEER'));
  lines.push('sb: ' + (p.get('sb')||'LEER'));
  lines.push('key: ' + (p.get('key')?'***'+p.get('key').slice(-4)+' ('+p.get('key').length+' Z.)':'LEER'));
  
  if (typeof Babel === 'undefined') {
    out.innerHTML = lines.join('<br>') + '<br><b style="color:red">Babel fehlt!</b>';
    return;
  }
  
  var code = "\nconst { useState, useEffect, useRef } = React;\n\nconst urlParams = new URLSearchParams(window.location.search);\nconst FORMULAR_ID = urlParams.get(\"id\") || \"\";\nconst SB_URL = urlParams.get(\"sb\") || \"\";\nconst SB_KEY = urlParams.get(\"key\") || \"\";\nconst LOGO = \"https://anspruchslotse.github.io/isuv-anspruchslotse/isuv-logo.png\";\nconst MONATE = [\"Januar\",\"Februar\",\"M\u00e4rz\",\"April\",\"Mai\",\"Juni\",\"Juli\",\"August\",\"September\",\"Oktober\",\"November\",\"Dezember\"];\n\nconst sbHeaders = () => ({\n  \"Content-Type\": \"application/json\",\n  \"apikey\": SB_KEY,\n  \"Authorization\": \"Bearer \" + SB_KEY\n});\n\nconst sbLade = async (id) => {\n  if (!SB_URL || !SB_KEY || !id) return null;\n  try {\n    const res = await fetch(SB_URL + \"/rest/v1/formulare?formular_id=eq.\" + encodeURIComponent(id), { headers: sbHeaders() });\n    if (!res.ok) return null;\n    const rows = await res.json();\n    return rows && rows[0] ? rows[0] : null;\n  } catch(e) { return null; }\n};\n\nconst sbSpeichere = async (id, daten, status) => {\n  if (!SB_URL || !SB_KEY) return false;\n  try {\n    const res = await fetch(SB_URL + \"/rest/v1/formulare?formular_id=eq.\" + encodeURIComponent(id), {\n      method: \"PATCH\",\n      headers: { ...sbHeaders(), \"Prefer\": \"return=minimal\" },\n      body: JSON.stringify({\n        antwort_daten: JSON.stringify(daten),\n        status: status,\n        beantwortet_am: new Date().toISOString()\n      })\n    });\n    return res.ok;\n  } catch(e) { return false; }\n};\n\n// \u2500\u2500 Unterschriften-Canvas \u2500\u2500\nfunction SignatureCanvas({ label, value, onChange }) {\n  const canvasRef = useRef(null);\n  const drawing = useRef(false);\n\n  const getPos = (canvas, evt) => {\n    const rect = canvas.getBoundingClientRect();\n    const scaleX = canvas.width / rect.width;\n    const scaleY = canvas.height / rect.height;\n    const src = evt.touches ? evt.touches[0] : evt;\n    return { x: (src.clientX - rect.left) * scaleX, y: (src.clientY - rect.top) * scaleY };\n  };\n\n  const startDraw = (e) => {\n    e.preventDefault();\n    drawing.current = true;\n    const canvas = canvasRef.current;\n    const ctx = canvas.getContext(\"2d\");\n    const pos = getPos(canvas, e);\n    ctx.beginPath(); ctx.moveTo(pos.x, pos.y);\n  };\n  const draw = (e) => {\n    e.preventDefault();\n    if (!drawing.current) return;\n    const canvas = canvasRef.current;\n    const ctx = canvas.getContext(\"2d\");\n    ctx.lineWidth = 2.5; ctx.lineCap = \"round\"; ctx.lineJoin = \"round\"; ctx.strokeStyle = \"#003366\";\n    const pos = getPos(canvas, e);\n    ctx.lineTo(pos.x, pos.y); ctx.stroke(); ctx.beginPath(); ctx.moveTo(pos.x, pos.y);\n  };\n  const stopDraw = (e) => {\n    if (!drawing.current) return;\n    drawing.current = false;\n    onChange(canvasRef.current.toDataURL());\n  };\n  const clear = () => {\n    const canvas = canvasRef.current;\n    canvas.getContext(\"2d\").clearRect(0, 0, canvas.width, canvas.height);\n    onChange(\"\");\n  };\n\n  return (\n    <div style={{ marginBottom: \"12px\" }}>\n      <div style={{ fontSize: \"11px\", fontWeight: \"bold\", color: \"#003366\", marginBottom: \"4px\" }}>{label}</div>\n      <div style={{ border: \"2px solid #003366\", borderRadius: \"8px\", background: \"#f9faff\", position: \"relative\", overflow: \"hidden\", touchAction: \"none\" }}>\n        <canvas ref={canvasRef} width={560} height={100} style={{ width: \"100%\", height: \"80px\", display: \"block\", cursor: \"crosshair\", touchAction: \"none\" }}\n          onMouseDown={startDraw} onMouseMove={draw} onMouseUp={stopDraw} onMouseLeave={stopDraw}\n          onTouchStart={startDraw} onTouchMove={draw} onTouchEnd={stopDraw} />\n        {!value && <div style={{ position: \"absolute\", top: \"50%\", left: \"50%\", transform: \"translate(-50%,-50%)\", color: \"#bbb\", fontSize: \"12px\", pointerEvents: \"none\" }}><span style={{fontSize:\"12px\"}}>Hier unterschreiben</span></div>}\n      </div>\n      <div style={{ display: \"flex\", justifyContent: \"space-between\", alignItems: \"center\", marginTop: \"3px\" }}>\n        <div style={{ fontSize: \"10px\", color: \"#888\" }}>Mit Finger oder Maus unterschreiben</div>\n        <button onClick={clear} style={{ fontSize: \"10px\", color: \"#e53935\", background: \"none\", border: \"1px solid #e53935\", borderRadius: \"4px\", padding: \"2px 8px\", cursor: \"pointer\" }}>\u2715 L\u00f6schen</button>\n      </div>\n      {value && <div style={{ fontSize: \"10px\", color: \"#2e7d32\", marginTop: \"2px\" }}>\u2705 Unterschrift vorhanden</div>}\n    </div>\n  );\n}\n\n// \u2500\u2500 PDF \u2500\u2500\nfunction oeffnePDF(fd, phase) {\n  const feld = (label, wert, breit) =>\n    '<div style=\"'+(breit?\"width:100%\":\"flex:1\")+';margin-bottom:10px\">'\n    + '<div style=\"font-size:9px;color:#555;margin-bottom:3px\">'+label+'</div>'\n    + '<div style=\"border:1px solid #ccc;border-radius:4px;min-height:26px;padding:5px 7px;font-size:12px;background:#fff\">'+(wert||\"\")+'</div></div>';\n  const zeile2 = (f1, f2) => '<div style=\"display:flex;gap:12px\">'+f1+f2+'</div>';\n  const sHead = (n, txt, color) =>\n    '<div style=\"background:'+(color||\"#003366\")+';color:#fff;padding:5px 8px;font-size:10px;font-weight:bold;letter-spacing:0.5px;text-transform:uppercase;margin:14px 0 6px;border-radius:4px\">'+n+\" \"+txt+\"</div>\";\n  const checkbox = (checked, label) =>\n    '<div style=\"display:flex;align-items:flex-start;gap:8px;margin-bottom:8px\">'\n    + '<div style=\"width:14px;height:14px;border:2px solid #003366;border-radius:2px;flex-shrink:0;margin-top:1px;background:'+(checked?\"#003366\":\"#fff\")+';\">'\n    + (checked ? '<span style=\"color:#fff;font-size:10px;font-weight:bold;display:block;text-align:center;line-height:14px\">\u2713</span>' : \"\")\n    + '</div><span style=\"font-size:11px;line-height:1.5\">'+label+\"</span></div>\";\n\n  let html = '<!DOCTYPE html><html><head><meta charset=\"UTF-8\"><title>Anlage TBG</title>'\n    + '<style>body{font-family:Arial,sans-serif;font-size:11px;color:#222;margin:0;padding:0;background:#f4f7f9}.page{max-width:780px;margin:0 auto;padding:20px 24px;background:#fff}.toolbar{background:#fff;border-bottom:1px solid #ddd;padding:10px 20px;display:flex;gap:10px;align-items:center;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,0.08)}@media print{body{background:#fff}.toolbar{display:none!important}.page{padding:8mm 10mm;max-width:100%;box-shadow:none}@page{margin:8mm 10mm;size:A4}}</style></head><body>'\n    + '<div class=\"toolbar\"><button onclick=\"window.print()\" style=\"background:#003366;color:#fff;border:none;padding:9px 22px;font-size:13px;font-weight:bold;border-radius:6px;cursor:pointer\">\ud83d\udda8\ufe0f Drucken / Als PDF speichern</button>'\n    + '<span style=\"font-size:11px;color:#666\">\u2192 Im Druckdialog <strong>\u201eAls PDF speichern\"</strong> w\u00e4hlen</span></div>'\n    + '<div class=\"page\">'\n    + '<div style=\"background:#003366;color:#fff;padding:10px 14px;border-radius:6px;margin-bottom:16px\">'\n    + '<div style=\"font-size:14px;font-weight:bold\">Antrag auf B\u00fcrgergeld \u2013 Anlage TBG</div>'\n    + '<div style=\"font-size:9px;margin-top:3px\">Tempor\u00e4re Bedarfsgemeinschaft \u00b7 ISUV Anspruchslotse \u00b7 '+new Date().toLocaleDateString(\"de-DE\")+'</div>'\n    + (phase === 1 ? '<div style=\"font-size:9px;margin-top:3px;background:#1565c0;display:inline-block;padding:2px 8px;border-radius:10px\">Phase 1 \u2013 Antragsteller*in</div>'\n      : '<div style=\"font-size:9px;margin-top:3px;background:#6a1b9a;display:inline-block;padding:2px 8px;border-radius:10px\">Phase 2 \u2013 Beide Elternteile</div>')\n    + '</div>';\n\n  html += sHead(\"\u2460\",\"Pers\u00f6nliche Daten Antragsteller*in\");\n  html += '<div style=\"border:1px solid #ddd;border-radius:6px;padding:10px\">';\n  html += zeile2(feld(\"Nachname\",fd.antNachname), feld(\"Vorname\",fd.antVorname));\n  html += feld(\"Stra\u00dfe und Hausnummer\", fd.antStrasse, true);\n  html += zeile2(feld(\"PLZ\",fd.antPlz), feld(\"Ort\",fd.antOrt));\n  html += zeile2(feld(\"Geburtsdatum\",fd.antGeburt), feld(\"BG-Nummer\",fd.antBGNr));\n  html += zeile2(feld(\"Telefon\",fd.antTel), feld(\"E-Mail\",fd.antMail));\n  html += feld(\"Aktenzeichen\",fd.antAktenzeichen,true);\n  html += '</div>';\n\n  (fd.kinder||[]).forEach(function(k, ki) {\n    const kal = k.kalender || { antragsteller: Array(12).fill(\"\"), anderer: Array(12).fill(\"\") };\n    const sumA = (kal.antragsteller||[]).reduce((s,x)=>s+(parseInt(x)||0),0);\n    const sumB = (kal.anderer||[]).reduce((s,x)=>s+(parseInt(x)||0),0);\n    html += '<div style=\"border:2px solid #00afad;border-radius:8px;padding:12px;margin-top:14px\">';\n    html += '<div style=\"font-weight:bold;font-size:13px;color:#00afad;margin-bottom:10px\">Kind #'+(ki+1)+'</div>';\n    html += sHead(\"\u2461\",\"Daten des Kindes und des anderen Elternteils\",\"#00afad\");\n    html += '<div style=\"border:1px solid #ddd;border-radius:6px;padding:10px\">';\n    html += '<div style=\"font-size:10px;font-weight:bold;color:#003366;margin-bottom:6px\">Kind</div>';\n    html += zeile2(feld(\"Nachname Kind\",k.kNachname), feld(\"Vorname Kind\",k.kVorname));\n    html += feld(\"Geburtsdatum Kind\", k.kGeburt, true);\n    html += '<div style=\"font-size:10px;font-weight:bold;color:#003366;margin:10px 0 6px;border-top:1px dashed #ddd;padding-top:8px\">Anderer Elternteil</div>';\n    html += zeile2(feld(\"Nachname\",k.epNachname), feld(\"Vorname\",k.epVorname));\n    html += feld(\"Stra\u00dfe und Hausnummer\", k.epStrasse, true);\n    html += zeile2(feld(\"PLZ\",k.epPlz), feld(\"Ort\",k.epOrt));\n    html += '</div>';\n    html += sHead(\"\u2462\",\"Gew\u00fcnschtes Aufteilungsmodell\");\n    html += '<div style=\"border:1px solid #ddd;border-radius:6px;padding:10px\">';\n    html += checkbox(k.aufteilungsWunsch===\"keine\",\"<strong>Keine Aufteilung</strong> \u2013 Kind wird nur im \u00fcberwiegend betreuenden Haushalt ber\u00fccksichtigt.\");\n    html += checkbox(k.aufteilungsWunsch===\"paritaetisch\",\"<strong>Parit\u00e4tisches Wechselmodell</strong> \u2013 ann\u00e4hernd h\u00e4lftige Betreuung (13/17 bis 15/15 Tage/Monat).\");\n    html += checkbox(k.aufteilungsWunsch===\"asymmetrisch\",\"<strong>Asymmetrisches Wechselmodell / Residenzmodell</strong> \u2013 2\u201312 Tage beim anderen Elternteil.\");\n    html += '</div>';\n    html += sHead(\"\u2463\",\"Kalender \u2013 Aufteilung der Betreuungstage\");\n    html += '<div style=\"border:1px solid #ddd;border-radius:6px;padding:10px\">';\n    html += '<div style=\"display:grid;grid-template-columns:1fr 80px 80px;gap:3px;margin-bottom:4px\">';\n    html += '<div style=\"font-size:9px;font-weight:bold;color:#003366;background:#e8f0fb;padding:3px 5px;border-radius:3px\">Monat \u2013 Jahr: '+(k.kalenderjahr||new Date().getFullYear())+'</div>';\n    html += '<div style=\"font-size:9px;font-weight:bold;color:#003366;background:#e8f0fb;padding:3px 5px;border-radius:3px;text-align:center\">Antragsteller*in</div>';\n    html += '<div style=\"font-size:9px;font-weight:bold;color:#003366;background:#e8f0fb;padding:3px 5px;border-radius:3px;text-align:center\">And. Elternteil</div>';\n    MONATE.forEach((m, mi) => {\n      const vA = (kal.antragsteller||[])[mi]||\"\"; const vB = (kal.anderer||[])[mi]||\"\";\n      const bg = mi%2===0 ? \"#f8fafc\" : \"#fff\";\n      html += '<div style=\"font-size:11px;padding:4px 5px;background:'+bg+';border-bottom:1px solid #f0f0f0\">'+m+'</div>';\n      html += '<div style=\"text-align:center;padding:3px;background:'+bg+';border-bottom:1px solid #f0f0f0\">'+(vA?'<span style=\"font-weight:bold\">'+vA+'</span>':'<span style=\"border-bottom:1px solid #999;display:inline-block;width:32px\">&nbsp;</span>')+'</div>';\n      html += '<div style=\"text-align:center;padding:3px;background:'+bg+';border-bottom:1px solid #f0f0f0\">'+(vB?'<span style=\"font-weight:bold\">'+vB+'</span>':'<span style=\"border-bottom:1px solid #999;display:inline-block;width:32px\">&nbsp;</span>')+'</div>';\n    });\n    html += '<div style=\"font-size:11px;font-weight:bold;padding:5px;background:#f0f4f7;border-top:2px solid #003366\">Gesamt</div>';\n    html += '<div style=\"font-size:11px;font-weight:bold;text-align:center;padding:5px;background:#f0f4f7;border-top:2px solid #003366\">'+(sumA||\"\u2013\")+'</div>';\n    html += '<div style=\"font-size:11px;font-weight:bold;text-align:center;padding:5px;background:#f0f4f7;border-top:2px solid #003366\">'+(sumB||\"\u2013\")+'</div>';\n    html += '</div></div>';\n    html += sHead(\"\u2464\",\"Angaben zum Einkommen des Kindes\");\n    html += '<div style=\"border:1px solid #ddd;border-radius:6px;padding:10px\">';\n    html += feld(\"Kindergeldberechtigte Person\",k.kgBerechtigt,true);\n    html += checkbox(k.kgWeiterleitung===\"ja\",\"Kindergeld wird weitergeleitet: \"+(k.kgBetrag?k.kgBetrag+\" \u20ac/Monat\":\"________ \u20ac/Monat\"));\n    html += checkbox(k.einkommenWeiterleitung===\"ja\",\"Einkommen des Kindes wird weitergeleitet: \"+(k.einkommenBetrag?k.einkommenBetrag+\" \u20ac/Monat\":\"________ \u20ac/Monat\"));\n    if(k.sonstigeAngaben) html += \"<div style='margin-top:8px;font-size:11px'><span style='font-size:9px;color:#555'>Sonstige Angaben:</span><br>\"+k.sonstigeAngaben+\"</div>\";\n    html += '</div></div>';\n  });\n\n  html += sHead(\"\u2465\",\"Unterschriften &amp; Umgangsvereinbarung\",\"#6a1b9a\");\n  html += '<div style=\"border:2px solid #6a1b9a;border-radius:8px;padding:12px\">';\n  html += '<div style=\"font-size:9px;color:#4a148c;background:#f3e5f5;border:1px solid #ce93d8;border-radius:5px;padding:8px;margin-bottom:10px\">\ud83d\udccb Diese Erkl\u00e4rung kann als formlose Umgangsvereinbarung dienen (\u00a7 1684 BGB).</div>';\n  html += zeile2(feld(\"Ort und Datum\",fd.ortDatum), feld(\"Datum (ISO)\",fd.datumISO));\n  html += '<div style=\"margin-top:12px\"><div style=\"font-size:9px;color:#555;margin-bottom:3px\">Unterschrift Antragsteller*in'+(fd.antVorname||fd.antNachname ? \": \"+fd.antVorname+\" \"+fd.antNachname : \"\")+'</div>';\n  html += fd.sigAntragsteller\n    ? '<img src=\"'+fd.sigAntragsteller+'\" style=\"max-height:50px;max-width:200px;border:1px solid #ccc;border-radius:3px;display:block\">'\n    : '<div style=\"height:60px;border:1px solid #ccc;border-radius:4px;background:#fff;width:220px\">&nbsp;</div>';\n  html += '</div>';\n  const ep0 = (fd.kinder||[])[0]||{};\n  const epName = ((ep0.epVorname||\"\")+\" \"+(ep0.epNachname||\"\")).trim();\n  html += '<div style=\"margin-top:14px\"><div style=\"font-size:9px;color:#555;margin-bottom:3px\">Unterschrift anderer Elternteil'+(epName?\": \"+epName:\"\")+'</div>';\n  html += fd.sigAndererElternteil\n    ? '<img src=\"'+fd.sigAndererElternteil+'\" style=\"max-height:50px;max-width:200px;border:1px solid #ccc;border-radius:3px;display:block\">'\n    : '<div style=\"height:60px;border:1px solid #ccc;border-radius:4px;background:#fff;width:220px\">&nbsp;</div>';\n  html += '</div></div>';\n  html += '<div style=\"margin-top:16px;font-size:8px;color:#aaa;text-align:center\">Erstellt mit ISUV Anspruchslotse \u00b7 '+new Date().toLocaleDateString(\"de-DE\")+'</div>';\n  html += '</div></body></html>';\n\n  const win = window.open(\"\",\"_blank\",\"width=860,height=1100,scrollbars=yes\");\n  if(!win) { alert(\"Bitte Pop-ups f\u00fcr diese Seite erlauben.\"); return; }\n  win.document.write(html); win.document.close(); win.focus();\n  setTimeout(()=>{ try { win.print(); } catch(e){} }, 600);\n}\n\n// \u2500\u2500 Leerkind \u2500\u2500\nconst LEERKIND = { kNachname:\"\", kVorname:\"\", kGeburt:\"\", epNachname:\"\", epVorname:\"\", epStrasse:\"\", epPlz:\"\", epOrt:\"\", epGeburt:\"\", aufteilungsWunsch:\"\", kalender:{ antragsteller:Array(12).fill(\"\"), anderer:Array(12).fill(\"\") }, kalenderjahr:String(new Date().getFullYear()), kgBerechtigt:\"\", kgWeiterleitung:\"\", kgBetrag:\"\", einkommenWeiterleitung:\"\", einkommenBetrag:\"\", sonstigeAngaben:\"\" };\n\n// \u2500\u2500 TBG Formular \u2500\u2500\nfunction TBGFormular({ vorausgefuellt, formularId, phase: initialPhase, beraterMail }) {\n  const leerDaten = {\n    antNachname:\"\", antVorname:\"\", antGeburt:\"\", antStrasse:\"\", antPlz:\"\", antOrt:\"\", antTel:\"\", antMail:\"\",\n    antBGNr:\"\", antAktenzeichen:\"\", ortDatum:\"\", datumISO:\"\",\n    sigAntragsteller:\"\", sigAndererElternteil:\"\",\n    kinder:[{...LEERKIND}]\n  };\n\n  const [fd, setFd] = useState({ ...leerDaten, ...vorausgefuellt });\n  const [phase, setPhase] = useState(initialPhase || 1);\n  const [sendet, setSendet] = useState(false);\n  const [gesendet, setGesendet] = useState(false);\n  const [fehler, setFehler] = useState(\"\");\n\n  const upd = (k, v) => setFd(p => ({...p, [k]: v}));\n  const kindUpd = (idx, k, v) => setFd(p => {\n    const kinder = p.kinder.map((c,i) => i===idx ? {...c, [k]: v} : c);\n    return {...p, kinder};\n  });\n  const kalUpd = (idx, seite, mi, v) => setFd(p => {\n    const kinder = p.kinder.map((c,i) => {\n      if(i!==idx) return c;\n      const kal = {...(c.kalender||{antragsteller:Array(12).fill(\"\"),anderer:Array(12).fill(\"\")})};\n      const arr = (kal[seite]||Array(12).fill(\"\")).slice();\n      arr[mi] = v; kal[seite] = arr;\n      return {...c, kalender: kal};\n    });\n    return {...p, kinder};\n  });\n  const addKind = () => setFd(p => ({...p, kinder: [...p.kinder, {...LEERKIND}]}));\n  const removeKind = (idx) => setFd(p => ({...p, kinder: p.kinder.filter((_,i)=>i!==idx)}));\n\n  const absenden = async (neuePhase) => {\n    const fehlendeFelder = [];\n    if(!fd.antNachname||!fd.antVorname) fehlendeFelder.push(\"Name Antragsteller*in\");\n    if(fd.kinder.length===0) fehlendeFelder.push(\"Mindestens 1 Kind\");\n    else fd.kinder.forEach((k,i)=>{ if(!k.kNachname||!k.kVorname) fehlendeFelder.push(\"Name Kind #\"+(i+1)); });\n    if(neuePhase===2 && !fd.sigAntragsteller) fehlendeFelder.push(\"Unterschrift Antragsteller*in\");\n    if(neuePhase===\"final\" && !fd.sigAndererElternteil) fehlendeFelder.push(\"Unterschrift anderer Elternteil\");\n    if(fehlendeFelder.length>0){ setFehler(\"Bitte ausf\u00fcllen:\\n- \"+fehlendeFelder.join(\"\\n- \")); return; }\n    if(!SB_URL||!SB_KEY||!formularId) {\n      setFehler(\"\u26a0\ufe0f Kein g\u00fcltiger \u00dcbermittlungslink. Bitte den Link erneut \u00fcber den Berater anfordern \u2013 dieses Formular kann nicht direkt \u00fcber die Datei versendet werden.\");\n      return;\n    }\n    setFehler(\"\"); setSendet(true);\n    const statusStr = neuePhase===2 ? \"phase1_done\" : \"beantwortet\";\n    const ok = await sbSpeichere(formularId, {...fd, _phase: neuePhase===2?1:2}, statusStr);\n    setSendet(false);\n    if(ok) {\n      if(neuePhase===2) { setPhase(2); window.scrollTo(0,0); }\n      else setGesendet(true);\n    } else {\n      setFehler(\"Fehler beim Senden. Bitte erneut versuchen oder den Berater kontaktieren.\");\n    }\n  };\n\n  if(gesendet) return (\n    <div>\n      <div className=\"success-box\">\n        <div style={{fontSize:\"2em\",marginBottom:\"8px\"}}>\u2705</div>\n        <strong>Vielen Dank!</strong><br/>\n        Ihre Angaben wurden erfolgreich \u00fcbermittelt.<br/>\n        {beraterMail && <div style={{marginTop:\"8px\",fontSize:\"12px\"}}>Eine Kopie k\u00f6nnen Sie per E-Mail an <strong>{beraterMail}</strong> senden.</div>}\n      </div>\n      <button className=\"btn btn-outline\" style={{marginTop:\"10px\"}} onClick={()=>oeffnePDF(fd,2)}>&#128196; PDF herunterladen / drucken</button>\n      {beraterMail && <a href={\"mailto:\"+beraterMail+\"?subject=Anlage TBG ausgef%C3%BCllt&amp;body=Guten Tag, anbei das ausgef\u00fcllte TBG-Formular.\"} className=\"btn btn-primary\" style={{marginTop:\"8px\",display:\"block\",textAlign:\"center\",textDecoration:\"none\"}}>\u2709\ufe0f Per E-Mail zur\u00fccksenden</a>}\n    </div>\n  );\n\n  const fi2 = { width:\"100%\", padding:\"7px 8px\", border:\"1px solid #ccc\", borderRadius:\"5px\", fontSize:\"12px\", boxSizing:\"border-box\", backgroundColor:\"#fff\", marginBottom:\"6px\" };\n\n  return (\n    <div>\n      {/* Phasenbadge */}\n      {phase===1\n        ? <div className=\"phase-badge p1\">&#128221; Phase 1 von 2 \u2013 Antragsteller*in f\u00fcllt aus</div>\n        : <div className=\"phase-badge p2\">\u270d\ufe0f Phase 2 von 2 \u2013 Zweite Unterschrift (anderer Elternteil)</div>\n      }\n\n      {/* Erkl\u00e4rung */}\n      <div className=\"info-box\">\n        \u2139\ufe0f <strong>Erkl\u00e4rung</strong> zur Aufteilung der Kindesbetreuung bei zeitweisem Aufenthalt eines Kindes im Haushalt (tempor\u00e4re Bedarfsgemeinschaft \u2013 TBG, \u00a7 7 Abs. 3 Nr. 4 SGB II)\n      </div>\n      <div className=\"tip-box\">\n        &#128161; <strong>Tipp f\u00fcr den anderen Elternteil:</strong> Wohngeld wird nicht gek\u00fcrzt, wenn das Kind zeitweise beim anderen Elternteil lebt (\u00a7 5 Abs. 3 WoGG). Kinderzuschlag bleibt bei Wechselmodell ebenfalls bestehen.\n      </div>\n\n      {fehler && <div className=\"error-box\" style={{whiteSpace:\"pre-line\"}}>{fehler}</div>}\n\n      {/* Phase 2: vorhandene Daten aus Phase 1 anzeigen, alles editierbar */}\n      {phase===2 && (\n        <div className=\"card\" style={{background:\"#f3e5f5\",border:\"1px solid #ce93d8\",marginBottom:\"12px\"}}>\n          <div style={{fontWeight:\"bold\",color:\"#6a1b9a\",marginBottom:\"4px\"}}>Phase 1 abgeschlossen \u2705</div>\n          <div style={{fontSize:\"11px\",color:\"#555\"}}>Die Daten aus Phase 1 sind vorausgef\u00fcllt. Sie k\u00f6nnen alle Felder bearbeiten, Ihre Unterschrift hinzuf\u00fcgen und das Formular abschlie\u00dfen.</div>\n        </div>\n      )}\n\n      {/* \u2460 Antragsteller */}\n      <div className=\"section-title\">\u2460 Pers\u00f6nliche Daten Antragsteller*in</div>\n      <div className=\"sbox\">\n        <div className=\"row2\">\n          <div><label style={{fontSize:\"11px\",color:\"#555\",fontWeight:\"normal\",marginBottom:\"3px\"}}>Nachname *</label><input style={fi2} value={fd.antNachname||\"\"} onChange={e=>upd(\"antNachname\",e.target.value)} placeholder=\"Nachname\"/></div>\n          <div><label style={{fontSize:\"11px\",color:\"#555\",fontWeight:\"normal\",marginBottom:\"3px\"}}>Vorname *</label><input style={fi2} value={fd.antVorname||\"\"} onChange={e=>upd(\"antVorname\",e.target.value)} placeholder=\"Vorname\"/></div>\n        </div>\n        <label style={{fontSize:\"11px\",color:\"#555\",fontWeight:\"normal\",marginBottom:\"3px\"}}>Stra\u00dfe und Hausnummer</label>\n        <input style={fi2} value={fd.antStrasse||\"\"} onChange={e=>upd(\"antStrasse\",e.target.value)} placeholder=\"Stra\u00dfe Nr.\"/>\n        <div className=\"row2\">\n          <div><label style={{fontSize:\"11px\",color:\"#555\",fontWeight:\"normal\",marginBottom:\"3px\"}}>PLZ</label><input style={fi2} value={fd.antPlz||\"\"} onChange={e=>upd(\"antPlz\",e.target.value)} placeholder=\"12345\"/></div>\n          <div><label style={{fontSize:\"11px\",color:\"#555\",fontWeight:\"normal\",marginBottom:\"3px\"}}>Ort</label><input style={fi2} value={fd.antOrt||\"\"} onChange={e=>upd(\"antOrt\",e.target.value)} placeholder=\"Stadt\"/></div>\n        </div>\n        <div className=\"row2\">\n          <div><label style={{fontSize:\"11px\",color:\"#555\",fontWeight:\"normal\",marginBottom:\"3px\"}}>Geburtsdatum</label><input style={fi2} value={fd.antGeburt||\"\"} onChange={e=>upd(\"antGeburt\",e.target.value)} placeholder=\"TT.MM.JJJJ\"/></div>\n          <div><label style={{fontSize:\"11px\",color:\"#555\",fontWeight:\"normal\",marginBottom:\"3px\"}}>BG-Nummer</label><input style={fi2} value={fd.antBGNr||\"\"} onChange={e=>upd(\"antBGNr\",e.target.value)} placeholder=\"opt.\"/></div>\n        </div>\n        <div className=\"row2\">\n          <div><label style={{fontSize:\"11px\",color:\"#555\",fontWeight:\"normal\",marginBottom:\"3px\"}}>Telefon</label><input style={fi2} type=\"tel\" value={fd.antTel||\"\"} onChange={e=>upd(\"antTel\",e.target.value)} placeholder=\"0170\u2026\"/></div>\n          <div><label style={{fontSize:\"11px\",color:\"#555\",fontWeight:\"normal\",marginBottom:\"3px\"}}>E-Mail</label><input style={fi2} type=\"email\" value={fd.antMail||\"\"} onChange={e=>upd(\"antMail\",e.target.value)} placeholder=\"name@mail.de\"/></div>\n        </div>\n        <label style={{fontSize:\"11px\",color:\"#555\",fontWeight:\"normal\",marginBottom:\"3px\"}}>Aktenzeichen / Kundennummer (opt.)</label>\n        <input style={fi2} value={fd.antAktenzeichen||\"\"} onChange={e=>upd(\"antAktenzeichen\",e.target.value)} placeholder=\"Aktenzeichen beim Jobcenter\"/>\n      </div>\n\n      {/* Kinder */}\n      {(fd.kinder||[]).map((kind, idx) => (\n        <div key={idx}>\n          <div className=\"section-title teal\" style={{display:\"flex\",justifyContent:\"space-between\",alignItems:\"center\"}}>\n            <span>\u2461 Kind {idx+1} \u2013 Daten und anderer Elternteil</span>\n            {idx>0 && <button onClick={()=>removeKind(idx)} style={{background:\"none\",border:\"none\",color:\"#fff\",cursor:\"pointer\",fontSize:\"16px\"}}>\u00d7</button>}\n          </div>\n          <div className=\"sbox teal\">\n            <div style={{fontSize:\"10px\",fontWeight:\"bold\",color:\"#00afad\",marginBottom:\"6px\"}}>Kind</div>\n            <div className=\"row2\">\n              <div><label style={{fontSize:\"11px\",color:\"#555\",fontWeight:\"normal\"}}>Nachname *</label><input style={fi2} value={kind.kNachname||\"\"} onChange={e=>kindUpd(idx,\"kNachname\",e.target.value)} placeholder=\"Nachname\"/></div>\n              <div><label style={{fontSize:\"11px\",color:\"#555\",fontWeight:\"normal\"}}>Vorname *</label><input style={fi2} value={kind.kVorname||\"\"} onChange={e=>kindUpd(idx,\"kVorname\",e.target.value)} placeholder=\"Vorname\"/></div>\n            </div>\n            <label style={{fontSize:\"11px\",color:\"#555\",fontWeight:\"normal\"}}>Geburtsdatum</label>\n            <input style={fi2} value={kind.kGeburt||\"\"} onChange={e=>kindUpd(idx,\"kGeburt\",e.target.value)} placeholder=\"TT.MM.JJJJ\"/>\n\n            <div style={{borderTop:\"1px dashed #ccc\",marginTop:\"8px\",paddingTop:\"8px\",fontSize:\"10px\",fontWeight:\"bold\",color:\"#00afad\",marginBottom:\"6px\"}}>Anderer Elternteil</div>\n            <div className=\"row2\">\n              <div><label style={{fontSize:\"11px\",color:\"#555\",fontWeight:\"normal\"}}>Nachname</label><input style={fi2} value={kind.epNachname||\"\"} onChange={e=>kindUpd(idx,\"epNachname\",e.target.value)} placeholder=\"Nachname\"/></div>\n              <div><label style={{fontSize:\"11px\",color:\"#555\",fontWeight:\"normal\"}}>Vorname</label><input style={fi2} value={kind.epVorname||\"\"} onChange={e=>kindUpd(idx,\"epVorname\",e.target.value)} placeholder=\"Vorname\"/></div>\n            </div>\n            <label style={{fontSize:\"11px\",color:\"#555\",fontWeight:\"normal\"}}>Stra\u00dfe und Hausnummer</label>\n            <input style={fi2} value={kind.epStrasse||\"\"} onChange={e=>kindUpd(idx,\"epStrasse\",e.target.value)} placeholder=\"Stra\u00dfe Nr.\"/>\n            <div className=\"row2\">\n              <div><label style={{fontSize:\"11px\",color:\"#555\",fontWeight:\"normal\"}}>PLZ</label><input style={fi2} value={kind.epPlz||\"\"} onChange={e=>kindUpd(idx,\"epPlz\",e.target.value)} placeholder=\"PLZ\"/></div>\n              <div><label style={{fontSize:\"11px\",color:\"#555\",fontWeight:\"normal\"}}>Ort</label><input style={fi2} value={kind.epOrt||\"\"} onChange={e=>kindUpd(idx,\"epOrt\",e.target.value)} placeholder=\"Ort\"/></div>\n            </div>\n          </div>\n\n          <div className=\"section-title\">\u2462 Gew\u00fcnschtes Aufteilungsmodell</div>\n          <div className=\"sbox\">\n            {[\n              {id:\"keine\",    label:\"Keine Aufteilung \u2013 Kind wird nur im \u00fcberwiegend betreuenden Haushalt ber\u00fccksichtigt.\"},\n              {id:\"paritaetisch\", label:\"Parit\u00e4tisches Wechselmodell \u2013 ann\u00e4hernd h\u00e4lftige Betreuung (13/17 bis 15/15 Tage/Monat).\"},\n              {id:\"asymmetrisch\", label:\"Asymmetrisches Wechselmodell / Residenzmodell \u2013 2\u201312 Tage beim anderen Elternteil.\"},\n            ].map(o => (\n              <div key={o.id} className=\"check-row\" onClick={()=>kindUpd(idx,\"aufteilungsWunsch\",o.id)}>\n                <div className={\"check-box\"+(kind.aufteilungsWunsch===o.id?\" checked\":\"\")}>{kind.aufteilungsWunsch===o.id&&<span style={{color:\"#fff\",fontSize:\"11px\",fontWeight:\"bold\"}}>\u2713</span>}</div>\n                <span>{o.label}</span>\n              </div>\n            ))}\n          </div>\n\n          <div className=\"section-title\">\u2463 Kalender \u2013 Betreuungstage je Monat</div>\n          <div className=\"sbox\">\n            <div className=\"kalender-grid\">\n              <div className=\"kal-head\">Monat {kind.kalenderjahr||new Date().getFullYear()}</div>\n              <div className=\"kal-head\">Antragsteller*in</div>\n              <div className=\"kal-head\">And. Elternteil</div>\n              {MONATE.map((m,mi)=>(\n                <React.Fragment key={mi}>\n                  <div className=\"kal-month\">{m}</div>\n                  <div className=\"kal-cell\"><input style={fi2} type=\"number\" min=\"0\" max=\"31\" value={(kind.kalender&&kind.kalender.antragsteller)?kind.kalender.antragsteller[mi]||\"\":\"\"} onChange={e=>kalUpd(idx,\"antragsteller\",mi,e.target.value)} placeholder=\"0\"/></div>\n                  <div className=\"kal-cell\"><input style={fi2} type=\"number\" min=\"0\" max=\"31\" value={(kind.kalender&&kind.kalender.anderer)?kind.kalender.anderer[mi]||\"\":\"\"} onChange={e=>kalUpd(idx,\"anderer\",mi,e.target.value)} placeholder=\"0\"/></div>\n                </React.Fragment>\n              ))}\n              <div style={{fontWeight:\"bold\",padding:\"5px 6px\",borderTop:\"2px solid #003366\",background:\"#f0f4f7\",fontSize:\"11px\"}}>Gesamt</div>\n              <div style={{fontWeight:\"bold\",textAlign:\"center\",padding:\"5px\",borderTop:\"2px solid #003366\",background:\"#f0f4f7\",fontSize:\"11px\"}}>\n                {((kind.kalender&&kind.kalender.antragsteller)||[]).reduce((s,x)=>s+(parseInt(x)||0),0)||\"\u2013\"}\n              </div>\n              <div style={{fontWeight:\"bold\",textAlign:\"center\",padding:\"5px\",borderTop:\"2px solid #003366\",background:\"#f0f4f7\",fontSize:\"11px\"}}>\n                {((kind.kalender&&kind.kalender.anderer)||[]).reduce((s,x)=>s+(parseInt(x)||0),0)||\"\u2013\"}\n              </div>\n            </div>\n            {/* Anteilige Regels\u00e4tze Berechnung */}\n            {(() => {\n              const tA = ((kind.kalender&&kind.kalender.antragsteller)||[]).reduce((s,x)=>s+(parseInt(x)||0),0);\n              const tB = ((kind.kalender&&kind.kalender.anderer)||[]).reduce((s,x)=>s+(parseInt(x)||0),0);\n              const ges = tA + tB;\n              if (ges === 0) return null;\n              const rbKind = 390;\n              const mb = Math.round(563 * 0.36 * 100) / 100;\n              let regelA, regelB, mehrA, mehrB, modellText;\n              const antA = tA/ges; const antB = tB/ges;\n              const istParit = antA >= 0.43 && antA <= 0.57;\n              if (istParit) {\n                regelA = rbKind * 0.5; regelB = rbKind * 0.5;\n                mehrA = mb / 2; mehrB = mb / 2;\n                modellText = \"Parit\u00e4tisch (ca. 50:50)\";\n              } else {\n                regelA = rbKind * antA; regelB = rbKind * antB;\n                if (antA >= antB) { mehrA = mb; mehrB = 0; } else { mehrA = 0; mehrB = mb; }\n                modellText = \"Asymmetrisch / Residenz\";\n              }\n              return (\n                <div style={{marginTop:\"10px\",background:\"#e8f5e9\",border:\"1px solid #a5d6a7\",borderRadius:\"7px\",padding:\"10px\",fontSize:\"11px\"}}>\n                  <div style={{fontWeight:\"bold\",color:\"#1b5e20\",marginBottom:\"6px\"}}>&#128202; Errechnete anteilige Regels\u00e4tze ({modellText})</div>\n                  <div style={{display:\"grid\",gridTemplateColumns:\"1fr 1fr\",gap:\"8px\"}}>\n                    <div style={{background:\"#fff\",borderRadius:\"5px\",padding:\"8px\",border:\"1px solid #c8e6c9\"}}>\n                      <div style={{fontWeight:\"bold\",color:\"#003366\",marginBottom:\"4px\"}}>Antragsteller*in ({tA} Tage \u00b7 {(antA*100).toFixed(0)}%)</div>\n                      <div style={{display:\"flex\",justifyContent:\"space-between\"}}><span>Regelbedarf Kind:</span><span style={{fontWeight:\"bold\"}}>{regelA.toFixed(2)} \u20ac</span></div>\n                      <div style={{display:\"flex\",justifyContent:\"space-between\"}}><span>+ Mehrbedarf \u00a7 21:</span><span style={{fontWeight:\"bold\"}}>{mehrA.toFixed(2)} \u20ac</span></div>\n                      <div style={{display:\"flex\",justifyContent:\"space-between\",borderTop:\"1px solid #003366\",marginTop:\"4px\",paddingTop:\"4px\",fontWeight:\"bold\"}}><span>Anteil gesamt:</span><span>{(regelA+mehrA).toFixed(2)} \u20ac</span></div>\n                    </div>\n                    <div style={{background:\"#fff\",borderRadius:\"5px\",padding:\"8px\",border:\"1px solid #c8e6c9\"}}>\n                      <div style={{fontWeight:\"bold\",color:\"#003366\",marginBottom:\"4px\"}}>And. Elternteil ({tB} Tage \u00b7 {(antB*100).toFixed(0)}%)</div>\n                      <div style={{display:\"flex\",justifyContent:\"space-between\"}}><span>Regelbedarf Kind:</span><span style={{fontWeight:\"bold\"}}>{regelB.toFixed(2)} \u20ac</span></div>\n                      <div style={{display:\"flex\",justifyContent:\"space-between\"}}><span>+ Mehrbedarf \u00a7 21:</span><span style={{fontWeight:\"bold\"}}>{mehrB.toFixed(2)} \u20ac</span></div>\n                      <div style={{display:\"flex\",justifyContent:\"space-between\",borderTop:\"1px solid #003366\",marginTop:\"4px\",paddingTop:\"4px\",fontWeight:\"bold\"}}><span>Anteil gesamt:</span><span>{(regelB+mehrB).toFixed(2)} \u20ac</span></div>\n                    </div>\n                  </div>\n                  <div style={{fontSize:\"10px\",color:\"#555\",marginTop:\"6px\"}}>Basis: Regelbedarf 390 \u20ac \u00b7 Mehrbedarf \u00a7 21 SGB II {mb.toFixed(2)} \u20ac \u00b7 BA-Weisung Ziff. 21.11</div>\n                </div>\n              );\n            })()}\n          </div>\n\n          <div className=\"section-title\">\u2464 Einkommen des Kindes</div>\n          <div className=\"sbox\">\n            <label style={{fontSize:\"11px\",color:\"#555\",fontWeight:\"normal\"}}>Kindergeldberechtigte Person</label>\n            <input style={fi2} value={kind.kgBerechtigt||\"\"} onChange={e=>kindUpd(idx,\"kgBerechtigt\",e.target.value)} placeholder=\"z.B. Antragsteller*in\"/>\n            <div className=\"check-row\" onClick={()=>kindUpd(idx,\"kgWeiterleitung\",kind.kgWeiterleitung===\"ja\"?\"\":\"ja\")}>\n              <div className={\"check-box\"+(kind.kgWeiterleitung===\"ja\"?\" checked\":\"\")}>{kind.kgWeiterleitung===\"ja\"&&<span style={{color:\"#fff\",fontSize:\"11px\",fontWeight:\"bold\"}}>\u2713</span>}</div>\n              <span>Kindergeld wird weitergeleitet an anderen Elternteil in H\u00f6he von</span>\n            </div>\n            {kind.kgWeiterleitung===\"ja\" && (\n              <div style={{display:\"flex\",alignItems:\"center\",gap:\"8px\",marginBottom:\"8px\",marginLeft:\"28px\"}}>\n                <input type=\"number\" style={{...fi2,width:\"90px\"}} value={kind.kgBetrag||\"\"} onChange={e=>kindUpd(idx,\"kgBetrag\",e.target.value)} placeholder=\"z.B. 250\"/>\n                <span style={{fontSize:\"12px\"}}>EUR/Monat</span>\n              </div>\n            )}\n            <div className=\"check-row\" onClick={()=>kindUpd(idx,\"einkommenWeiterleitung\",kind.einkommenWeiterleitung===\"ja\"?\"\":\"ja\")}>\n              <div className={\"check-box\"+(kind.einkommenWeiterleitung===\"ja\"?\" checked\":\"\")}>{kind.einkommenWeiterleitung===\"ja\"&&<span style={{color:\"#fff\",fontSize:\"11px\",fontWeight:\"bold\"}}>\u2713</span>}</div>\n              <span>Einkommen des Kindes wird weitergeleitet in H\u00f6he von</span>\n            </div>\n            {kind.einkommenWeiterleitung===\"ja\" && (\n              <div style={{display:\"flex\",alignItems:\"center\",gap:\"8px\",marginBottom:\"8px\",marginLeft:\"28px\"}}>\n                <input type=\"number\" style={{...fi2,width:\"90px\"}} value={kind.einkommenBetrag||\"\"} onChange={e=>kindUpd(idx,\"einkommenBetrag\",e.target.value)} placeholder=\"z.B. 357\"/>\n                <span style={{fontSize:\"12px\"}}>EUR/Monat</span>\n              </div>\n            )}\n            <label style={{fontSize:\"11px\",color:\"#555\",fontWeight:\"normal\",marginTop:\"8px\"}}>Sonstige Angaben</label>\n            <textarea style={{...fi2,height:\"60px\",resize:\"vertical\"}} value={kind.sonstigeAngaben||\"\"} onChange={e=>kindUpd(idx,\"sonstigeAngaben\",e.target.value)} placeholder=\"Besonderheiten\u2026\"/>\n          </div>\n        </div>\n      ))}\n\n      <button onClick={addKind} style={{width:\"100%\",padding:\"11px\",background:\"#e8f4fd\",color:\"#003366\",border:\"2px dashed #003366\",borderRadius:\"8px\",cursor:\"pointer\",fontWeight:\"bold\",fontSize:\"13px\",marginBottom:\"14px\"}}>\n        + Weiteres Kind hinzuf\u00fcgen\n      </button>\n\n      {/* \u2465 Unterschriften */}\n      <div className=\"section-title purple\">\u2465 Unterschriften &amp; Umgangsvereinbarung</div>\n      <div className=\"sbox purple\">\n        <div className=\"warn-box\">\n          &#128203; <strong>Hinweis:</strong> Diese Erkl\u00e4rung kann als formlose Umgangsvereinbarung dienen, wenn beide Elternteile unterschreiben (\u00a7 1684 BGB). Eine notarielle Beurkundung ist f\u00fcr vollstreckbare Vereinbarungen empfohlen.\n        </div>\n        <div className=\"row2\" style={{marginBottom:\"10px\"}}>\n          <div>\n            <label style={{fontSize:\"11px\",color:\"#555\",fontWeight:\"normal\"}}>Ort und Datum</label>\n            <input style={fi2} value={fd.ortDatum||\"\"} onChange={e=>upd(\"ortDatum\",e.target.value)} placeholder={\"z.B. Hamburg, \"+new Date().toLocaleDateString(\"de-DE\")}/>\n          </div>\n          <div>\n            <label style={{fontSize:\"11px\",color:\"#555\",fontWeight:\"normal\"}}>Datum</label>\n            <input style={fi2} type=\"date\" value={fd.datumISO||\"\"} onChange={e=>upd(\"datumISO\",e.target.value)}/>\n          </div>\n        </div>\n\n        {phase===1 && (\n          <>\n            <SignatureCanvas\n              label={\"\u270d\ufe0f Unterschrift Antragsteller*in: \"+(fd.antVorname||\"\")+\" \"+(fd.antNachname||\"\")}\n              value={fd.sigAntragsteller||\"\"}\n              onChange={v=>upd(\"sigAntragsteller\",v)}\n            />\n            <div style={{background:\"#e8f0fb\",border:\"1px solid #90caf9\",borderRadius:\"6px\",padding:\"8px\",fontSize:\"11px\",color:\"#003366\",marginTop:\"8px\"}}>\n              \u2139\ufe0f Nach dem Absenden erh\u00e4lt der andere Elternteil denselben Link zur Pr\u00fcfung und Unterschrift (Phase 2).\n            </div>\n          </>\n        )}\n        {phase===2 && (\n          <>\n            {fd.sigAntragsteller && (\n              <div style={{marginBottom:\"12px\"}}>\n                <div style={{fontSize:\"11px\",fontWeight:\"bold\",color:\"#2e7d32\",marginBottom:\"4px\"}}>\u2705 Unterschrift Antragsteller*in bereits vorhanden</div>\n                <img src={fd.sigAntragsteller} style={{maxHeight:\"50px\",border:\"1px solid #ccc\",borderRadius:\"4px\"}}/>\n              </div>\n            )}\n            <SignatureCanvas\n              label={\"\u270d\ufe0f Unterschrift anderer Elternteil: \"+((fd.kinder[0]&&fd.kinder[0].epVorname)||\"\")+\" \"+((fd.kinder[0]&&fd.kinder[0].epNachname)||\"\")}\n              value={fd.sigAndererElternteil||\"\"}\n              onChange={v=>upd(\"sigAndererElternteil\",v)}\n            />\n          </>\n        )}\n      </div>\n\n      {/* Aktionen */}\n      <div style={{marginTop:\"16px\",display:\"flex\",flexDirection:\"column\",gap:\"8px\"}}>\n        {phase===1 && (\n          <>\n            <button className=\"btn btn-primary\" onClick={()=>absenden(2)} disabled={sendet}>\n              {sendet ? \"Wird gespeichert\u2026\" : \"\u2705 Absenden &amp; weiter zu Phase 2\"}\n            </button>\n            <button className=\"btn btn-outline\" onClick={()=>oeffnePDF(fd,1)}>&#128196; PDF Vorschau (Phase 1)</button>\n          </>\n        )}\n        {phase===2 && (\n          <>\n            <button className=\"btn btn-purple\" onClick={()=>absenden(\"final\")} disabled={sendet}>\n              {sendet ? \"Wird gespeichert\u2026\" : \"\u2705 Formular abschlie\u00dfen &amp; absenden\"}\n            </button>\n            <button className=\"btn btn-outline\" onClick={()=>oeffnePDF(fd,2)}>&#128196; PDF herunterladen / drucken</button>\n            {beraterMail && (\n              <a href={\"mailto:\"+beraterMail+\"?subject=Anlage TBG \u2013 Ausgef%C3%BCll&amp;body=Guten Tag, das TBG-Formular wurde ausgef\u00fcllt.\"} className=\"btn btn-success\" style={{display:\"block\",textAlign:\"center\",textDecoration:\"none\"}}>\n                \u2709\ufe0f Per E-Mail an Berater*in zur\u00fccksenden\n              </a>\n            )}\n          </>\n        )}\n      </div>\n      <p className=\"pflicht-info\">* Pflichtfelder \u00b7 Daten werden verschl\u00fcsselt \u00fcbertragen</p>\n    </div>\n  );\n}\n\n// \u2500\u2500 Haupt-App \u2500\u2500\nfunction FormularApp() {\n  const [status, setStatus] = useState(\"laden\");\n  const [formular, setFormular] = useState(null);\n  const [fehlerText, setFehlerText] = useState(\"\");\n\n  useEffect(() => {\n    if(!FORMULAR_ID) { setStatus(\"kein_id\"); return; }\n    if(!SB_URL||!SB_KEY) { setStatus(\"fehler\"); setFehlerText(\"Fehlende Verbindungsdaten. Bitte Link erneut anfordern.\"); return; }\n    sbLade(FORMULAR_ID).then(row => {\n      if(!row) { setStatus(\"fehler\"); setFehlerText(\"Formular nicht gefunden. M\u00f6glicherweise abgelaufen.\"); return; }\n      if(row.status===\"beantwortet\") { setStatus(\"abgeschlossen\"); setFormular(row); return; }\n      setFormular(row);\n      setStatus(\"bereit\");\n    });\n  }, []);\n\n  const vorausgefuellt = formular ? (() => { try { return JSON.parse(formular.vorausgefuellt||\"{}\"); } catch(e){ return {}; } })() : {};\n  const antwortDaten = formular ? (() => { try { return JSON.parse(formular.antwort_daten||\"{}\"); } catch(e){ return {}; } })() : {};\n  const typ = formular ? formular.typ : \"\";\n  const label = formular ? (formular.label||\"Formular\") : \"\";\n  const beraterMail = formular ? (formular.berater_mail||\"\") : \"\";\n  // Phase bestimmen: phase1_done \u2192 Phase 2, sonst Phase 1\n  const currentPhase = formular && formular.status === \"phase1_done\" ? 2 : 1;\n  // F\u00fcr Phase 2: vorausgef\u00fcllte Daten = gespeicherte Antwortdaten aus Phase 1\n  const initDaten = currentPhase===2 ? {...vorausgefuellt, ...antwortDaten} : vorausgefuellt;\n\n  return (\n    <div>\n      <div className=\"header\">\n        <img src={LOGO} alt=\"ISUV\" onError={e=>e.target.style.display=\"none\"}/>\n        <h2>ISUV Anspruchslotse</h2>\n        {formular && <p>{label}</p>}\n      </div>\n\n      {status===\"laden\" && <div className=\"loading\"><div className=\"spinner\"></div><p>Wird geladen\u2026</p></div>}\n\n      {status===\"fehler\" && <div className=\"error-box\"><strong>\u26a0\ufe0f Fehler</strong><br/>{fehlerText}</div>}\n\n      {status===\"kein_id\" && (\n        <div className=\"error-box\">\n          <strong>\u26a0\ufe0f Kein Formular-Link</strong><br/><br/>\n          Diese Seite kann nur \u00fcber einen pers\u00f6nlichen Link ge\u00f6ffnet werden, den Ihr ISUV-Berater Ihnen per E-Mail oder WhatsApp zugeschickt hat.<br/><br/>\n          <span style={{fontSize:\"11px\",color:\"#888\"}}>Bitte \u00f6ffnen Sie den Link direkt aus Ihrer Nachricht.</span>\n        </div>\n      )}\n\n      {status===\"abgeschlossen\" && (\n        <div>\n          <div className=\"success-box\">\n            <div style={{fontSize:\"2em\",marginBottom:\"8px\"}}>\u2705</div>\n            <strong>Formular abgeschlossen</strong><br/>\n            Dieses Formular wurde vollst\u00e4ndig ausgef\u00fcllt und \u00fcbermittelt.\n          </div>\n          <button className=\"btn btn-outline\" style={{marginTop:\"10px\"}} onClick={()=>oeffnePDF({...vorausgefuellt,...antwortDaten},2)}>&#128196; PDF herunterladen</button>\n        </div>\n      )}\n\n      {status===\"bereit\" && typ===\"tbg\" && (\n        <TBGFormular\n          vorausgefuellt={initDaten}\n          formularId={FORMULAR_ID}\n          phase={currentPhase}\n          beraterMail={beraterMail}\n        />\n      )}\n\n      {status===\"bereit\" && typ===\"stammdaten\" && (\n        <div className=\"error-box\">Stammdaten-Formular: Bitte die passende formular.html verwenden.</div>\n      )}\n\n      {status===\"bereit\" && typ!==\"tbg\" && typ!==\"stammdaten\" && (\n        <div className=\"error-box\">Unbekannter Formulartyp: {typ}. Bitte neuen Link anfordern.</div>\n      )}\n    </div>\n  );\n}\n\n(function(){\n  var c = document.getElementById(\"root\");\n  if (ReactDOM.createRoot) { ReactDOM.createRoot(c).render(React.createElement(FormularApp)); }\n  else { ReactDOM.render(React.createElement(FormularApp), c); }\n})();\n">
